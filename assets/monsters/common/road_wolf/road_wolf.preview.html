<!DOCTYPE html>
<meta charset="utf-8">
<title>Road Wolf v1 — atlas preview</title>
<style>
  body{background:#0d1117;color:#cdd6e0;font:14px monospace;padding:16px}
  .grid{display:grid;grid-template-columns:repeat(5,auto);gap:14px}
  .card{background:#161d26;border:1px solid #2a3542;padding:10px;text-align:center}
  canvas{image-rendering:pixelated;background:#0a0e13;border:1px solid #222c38}
  h1{font-size:16px}
</style>
<h1>Road Wolf v1 — animation preview (2×)</h1>
<div class="grid" id="grid"></div>
<script>
const META={
  idle:{frames:4,fps:5,loop:true,rows:{south:0,east:1,north:2}},
  walk:{frames:6,fps:10,loop:true,rows:{south:3,east:4,north:5}},
  attack:{frames:6,fps:12,loop:false,rows:{south:6,east:7,north:8},duration:520},
  hit:{frames:3,fps:12,loop:false,rows:{south:9,east:10,north:11},duration:250},
  death:{frames:6,fps:8,loop:false,rows:{south:12,east:13,north:14},duration:760}
};
const CW=128,CH=96,img=new Image();
img.src='road_wolf.atlas.png';
img.onload=()=>{
  const grid=document.getElementById('grid');
  for(const dir of['south','east','north','west']){
    for(const[anim,m]of Object.entries(META)){
      const card=document.createElement('div');card.className='card';
      const cv=document.createElement('canvas');cv.width=CW*2;cv.height=CH*2;
      card.appendChild(cv);
      card.insertAdjacentHTML('beforeend',`<div>${anim} ${dir}</div>`);
      grid.appendChild(card);
      const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
      const face=dir==='west'?'east':dir,row=m.rows[face];
      const start=performance.now();
      (function tick(){
        const t=performance.now()-start;
        let f;
        if(m.loop)f=Math.floor((t/1000)*m.fps)%m.frames;
        else{const c=t%(m.duration+600);f=Math.min(m.frames-1,Math.floor((c/m.duration)*m.frames))}
        ctx.clearRect(0,0,cv.width,cv.height);
        ctx.save();
        if(dir==='west'){ctx.translate(cv.width,0);ctx.scale(-1,1)}
        ctx.drawImage(img,f*CW,row*CH,CW,CH,0,0,CW*2,CH*2);
        ctx.restore();
        requestAnimationFrame(tick)
      })();
    }
  }
};
</script>
