name: Migrate ASHFALL v0.14.0 source

on:
  push:
    branches:
      - codex/v014-source-migration
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: codex/v014-source-migration

      - name: Extract canonical split source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f migration_manifest.json ]; then
            echo "Canonical split source is already present."
            exit 0
          fi

          extraction_dir="$(mktemp -d)"
          unzip -q ASHFALL_v0.14.0_Open_World_Source.zip -d "$extraction_dir"
          source_dir="$extraction_dir/ASHFALL_v0.14.0_Open_World_Source"

          mkdir -p assets css js release
          cp -f "$source_dir/README.md" README.md
          cp -f "$source_dir/HANDOFF.md" HANDOFF.md
          cp -f "$source_dir/migration_manifest.json" migration_manifest.json
          cp -f "$source_dir/index.html" index.html
          cp -f "$source_dir/css/game.css" css/game.css
          cp -f "$source_dir/js/game.js" js/game.js
          cp -f "$source_dir"/assets/*.png assets/

          node --check js/game.js
          node scripts/build-bundle.mjs

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md HANDOFF.md migration_manifest.json index.html css/game.css js/game.js assets scripts/build-bundle.mjs release/ASHFALL_Huntbound_Alpha_v0.14.0_Open_World.html
          git commit -m "Migrate ASHFALL v0.14.0 split source"
          git push origin HEAD:codex/v014-source-migration
