<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASHFALL Mob Sprite Batch 02</title>
<style>
body{margin:0;background:#091019;color:#e7eef9;font:14px ui-monospace,monospace}
main{max-width:1100px;margin:24px auto;padding:20px}
h1{letter-spacing:2px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
select{background:#132033;color:#e7eef9;border:1px solid #36506f;border-radius:6px;padding:8px}
canvas{width:100%;max-width:960px;background:#111a25;border:1px solid #2d4562;image-rendering:pixelated}
.note{color:#91a8bf}
</style>
</head>
<body>
<main>
<h1>ASHFALL MOB SPRITE BATCH 02</h1>
<p>Ashfall Hollow undead: Bone Archer, Grave Husk and Restless Dead.</p>
<div class="controls">
<label>Animation <select id="anim"><option>idle</option><option>walk</option><option>attack</option><option>special</option><option>hit</option><option>death</option></select></label>
<label>Facing <select id="face"><option>south</option><option>east</option><option>west</option><option>north</option></select></label>
</div>
<canvas id="view" width="960" height="320"></canvas>
<p class="note">The preview uses the shared MobSpriteLibrary and manifest contract. Missing generated assets remain on the procedural-renderer fallback.</p>
<script src="../js/mob-sprite-runtime.js"></script>
<script>
(async()=>{
 const lib=await new AshfallMobSprites.MobSpriteLibrary('../assets/monsters/manifest.v1.json').init();
 const canvas=document.getElementById('view'),ctx=canvas.getContext('2d');
 const kinds=['bonearcher','gravehusk','skeleton'];
 function loop(now){
  ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#172331';ctx.fillRect(0,0,canvas.width,canvas.height);
  kinds.forEach((kind,i)=>{
   const x=105+i*295,y=92;
   lib.draw(ctx,{kind,facing:face.value,animStarted:now-500},{animation:anim.value,facing:face.value,now,x,y,width:160,height:160});
   ctx.fillStyle='#e9f1fb';ctx.textAlign='center';ctx.fillText(kind.toUpperCase(),x+80,280);
  });
  requestAnimationFrame(loop)
 }
 requestAnimationFrame(loop)
})();
</script>
</main>
</body>
</html>
