<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASHFALL Mob Sprite Pilot</title>
<style>
  body{margin:0;background:#091019;color:#e7eef9;font:14px ui-monospace,monospace}
  main{max-width:1100px;margin:24px auto;padding:20px}
  h1{letter-spacing:2px}
  .controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
  select,button{background:#132033;color:#e7eef9;border:1px solid #36506f;border-radius:6px;padding:8px}
  canvas{width:100%;max-width:960px;background:#111a25;border:1px solid #2d4562;image-rendering:pixelated}
  code{color:#8ed7ff}
</style>
</head>
<body>
<main>
<h1>ASHFALL MOB SPRITE PILOT</h1>
<p>Animation-ready SVG atlases: Road Wolf, Ash Goblin, Gloam Spider and Bell Wraith.</p>
<div class="controls">
<label>Animation <select id="anim"><option>idle</option><option>walk</option><option>attack</option><option>special</option><option>hit</option><option>death</option></select></label>
<label>Facing <select id="face"><option>south</option><option>east</option><option>west</option><option>north</option></select></label>
</div>
<canvas id="view" width="960" height="320"></canvas>
<p>Renderer integration entry point: <code>globalThis.AshfallMobSprites.MobSpriteLibrary</code></p>
<script src="../js/mob-sprite-runtime.js"></script>
<script>
(async()=>{
  const lib=await new AshfallMobSprites.MobSpriteLibrary('../assets/monsters/manifest.v1.json').init();
  const canvas=document.getElementById('view'),ctx=canvas.getContext('2d');
  const kinds=['wolf','goblin','spider','wraith'];
  function loop(now){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#172331';ctx.fillRect(0,0,canvas.width,canvas.height);
    kinds.forEach((kind,i)=>{
      const x=92+i*225,y=110;
      lib.draw(ctx,{kind,facing:face.value,animStarted:now-500},{animation:anim.value,facing:face.value,now,x,y,width:128,height:128});
      ctx.fillStyle='#e9f1fb';ctx.textAlign='center';ctx.fillText(kind.toUpperCase(),x+64,270);
    });
    requestAnimationFrame(loop)
  }
  requestAnimationFrame(loop)
})();
</script>
</main>
</body>
</html>
